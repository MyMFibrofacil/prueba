<!doctype html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos Valeria Lotz</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = { theme: { extend: { colors: { primary: "#640505", "background-light": "#f8f5f5", whatsapp: "#25D366" }, fontFamily: { display: "Inter" } } } };
    </script>
    <style>
      body { min-height: max(884px, 100dvh); }
      input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
    <script>window.APP_CLIENT_KEY = "valeria"; window.APP_ASSET_PREFIX = "../";</script>
  </head>
  <body class="bg-background-light font-display text-slate-900 min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-white border-b border-primary/10 shadow-sm relative">
      <img id="app-logo" src="" alt="Logo" class="absolute top-2 right-3 w-8 h-8 object-contain opacity-70" onerror="this.style.display='none'" />
      <div id="thickness-tabs" class="flex overflow-x-auto border-b border-slate-200 px-4 scrollbar-hide"></div>
      <div id="search-wrapper" class="px-4 py-3">
        <label class="flex h-11 w-full rounded-xl border border-slate-200 bg-slate-100 focus-within:border-primary">
          <span class="material-symbols-outlined self-center pl-4 text-slate-400">search</span>
          <input id="search-input" class="w-full border-0 bg-transparent px-3 text-sm focus:ring-0" placeholder="Buscar productos o categorías..." />
        </label>
      </div>
    </header>
    <main id="catalog-scroll" class="flex-1 overflow-y-auto pb-52">
      <div id="families-container" class="space-y-4 px-4 py-3"></div>
      <p id="empty-state" class="hidden px-4 text-sm text-slate-500">No encontramos productos con esa búsqueda.</p>
    </main>
    <button id="scroll-to-bottom" type="button" aria-label="Ir al final" class="hidden fixed right-4 bottom-48 z-[70] size-12 rounded-full bg-primary text-white shadow-lg"><span class="material-symbols-outlined">keyboard_double_arrow_down</span></button>
    <div id="status-toast" class="pointer-events-none fixed left-1/2 top-5 z-[90] hidden w-[calc(100%-2rem)] max-w-sm -translate-x-1/2 rounded-2xl px-4 py-3 text-sm font-bold"></div>
    <div class="fixed bottom-0 left-0 right-0 z-50 space-y-3 border-t border-slate-200 bg-white p-4">
      <div id="summary-details-panel" class="absolute bottom-[calc(100%+8px)] left-4 right-4 hidden rounded-xl border border-slate-200 bg-white shadow-xl"><div class="border-b border-slate-200 px-4 py-3"><p id="summary-title" class="text-sm font-bold">Detalle del pedido</p></div><div id="summary-details-list" class="max-h-72 overflow-y-auto"></div></div>
      <button id="summary-toggle" class="flex w-full items-center justify-between rounded-lg px-2 py-2" type="button"><div id="summary-totals" class="min-w-0 flex-1 space-y-1"></div><span id="summary-chevron" class="material-symbols-outlined ml-3 text-slate-500">expand_less</span></button>
      <p id="status-message" class="min-h-4 px-2 text-xs text-slate-500"></p>
      <button id="send-whatsapp" class="flex w-full items-center justify-center gap-2 rounded-xl bg-whatsapp py-4 font-bold text-white shadow-lg disabled:cursor-not-allowed disabled:opacity-50"><span class="material-symbols-outlined">send</span><span id="send-button-label">Copiar Pedido y Abrir WhatsApp</span></button>
    </div>
    <script src="../clients.js"></script>
    <script src="../controller.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
